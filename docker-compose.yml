services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calm_corner
      POSTGRES_USER: calm
      POSTGRES_PASSWORD: calm_local_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calm -d calm_corner']
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
